<style>
:root{--bg:#f3f1ea;--panel:#fff;--ink:#17203a;--mute:#5b6480;--line:#d8d4c6;--brass:#8a6a1c;--teal:#1f7a7a;--moon:#17203a;--moonlit:#f1e7c4;

:root[data-theme="dark"]{--bg:#0e1429;--panel:#162040;--ink:#ebe6d6;--mute:#9aa3c0;--line:#2a3560;--brass:#d2ab4e;--teal:#6cc0bd;--moon:#0b1022;--moonlit:#f1e7c4}
html{color-scheme:light dark;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Hind Siliguri",system-ui,sans-serif;padding-bottom:72px}
h1,h2,h3{font-family:"Noto Serif Bengali",Georgia,serif;line-height:1.3;margin:0 0 .5rem}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
header b{font-family:Georgia,serif;letter-spacing:.14em;font-size:15px}
button{font:inherit;cursor:pointer;color:inherit}
.lang{border:1px solid var(--line);background:none;border-radius:20px;padding:2px 12px}
main{max-width:720px;margin:0 auto;padding:18px}
section{display:none}section.on{display:block}
.hero{padding:10px 0 22px}
.hero h1{font-size:1.9rem}
.hero p{color:var(--mute);margin:0}
.moonrow{display:flex;gap:18px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:16px;margin:14px 0}
.moonrow svg{flex:none}
.k{color:var(--mute);font-size:14px}
.card{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:14px 16px;margin:10px 0}
.tag{display:inline-block;font-size:13px;border:1px solid var(--teal);color:var(--teal);border-radius:12px;padding:0 10px;margin-left:6px}
.tag.p{border-color:var(--brass);color:var(--brass)}
details summary{cursor:pointer;font-weight:600}
details ul{margin:.5rem 0 0;padding-left:1.2rem;color:var(--mute)}
label{display:block;margin:10px 0 4px;font-weight:600}
input,select,textarea{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.go{margin-top:14px;background:var(--brass);color:#fff;border:0;border-radius:8px;padding:10px 20px;font-weight:600}
.out{margin-top:14px;border-left:3px solid var(--brass);padding:4px 14px}
.out h3{font-size:1.05rem;margin-top:12px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav{overflow-x:auto}nav button{flex:0 0 auto;border:0;background:none;padding:12px 14px;font-size:14px;white-space:nowrap;color:var(--mute)}
nav button.on{color:var(--brass);font-weight:600;box-shadow:inset 0 2px 0 var(--brass)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.tile{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:14px 12px;text-align:left;font-weight:600;line-height:1.3}.tile small{display:block;font-weight:400;color:var(--mute);font-size:13px;margin-top:2px}.tile:active{border-color:var(--brass)}
.note{font-size:14px;color:var(--mute);border-top:1px solid var(--line);margin-top:20px;padding-top:10px}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
</style>
</head>

function moonInfo(d){var syn=29.530588853,ref=Date.UTC(2000,0,6,18,14);var age=(((d.getTime()-ref)/864e5)%syn+syn)%syn;
 var f=(1-Math.cos(2*Math.PI*age/syn))/2;return{age:age,f:f,idx:Math.floor((age/syn)*8+.5)%8}}
function moonSvg(f,age){var r=34,waxing=age<14.765,k=1-2*f;/* terminator x-radius */
 var rx=Math.abs(k)*r;var litRight=waxing;
 var d=litRight?'M40 6 A34 34 0 0 1 40 74 A'+rx+' 34 0 0 '+(k>0?0:1)+' 40 6':'M40 6 A34 34 0 0 0 40 74 A'+rx+' 34 0 0 '+(k>0?1:0)+' 40 6';
 return '<svg width="80" height="80" viewBox="0 0 80 80" role="img" aria-label="moon"><circle cx="40" cy="40" r="34" fill="var(--moon)" stroke="var(--line)"/><path d="'+d+'" fill="var(--moonlit)"/></svg>'}
function binom(n,k,p){var s=0,lc=0,i;var lf=[0];for(i=1;i<=n;i++)lf[i]=lf[i-1]+Math.log(i);
 for(i=k;i<=n;i++){s+=Math.exp(lf[n]-lf[i]-lf[n-i]+i*Math.log(p)+(n-i)*Math.log(1-p))}return Math.min(1,s)}
